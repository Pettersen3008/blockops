name: Release gate and image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  destructive:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: bun run playwright install --with-deps chromium
        working-directory: frontend

      - name: Start the disposable real-server fixture
        run: scripts/integration.sh up

      - name: Run the destructive integration journey
        env:
          BLOCKOPS_E2E_COMPOSE_PROJECT: blockops-integration
          BLOCKOPS_E2E_DESTRUCTIVE: "true"
          BLOCKOPS_E2E_INTEGRATION: "true"
          BLOCKOPS_E2E_URL: http://127.0.0.1:8099
        run: bun run test:e2e
        working-directory: frontend

      - name: Remove the fixture and its volumes
        if: always()
        run: scripts/integration.sh down

  publish:
    runs-on: ubuntu-latest
    needs: destructive
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must match vMAJOR.MINOR.PATCH: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'image=%s\nversion=%s\n' "$image" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Export release evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          reference="$IMAGE@$DIGEST"
          printf '%s\n' "$reference" > "release/blockops-$VERSION-image.txt"
          docker buildx imagetools inspect --raw "$reference" > "release/blockops-$VERSION-image-index.json"
          jq -e '
            [.manifests[]
              | select(.platform.os == "linux")
              | "\(.platform.os)/\(.platform.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' "release/blockops-$VERSION-image-index.json" >/dev/null

          for platform in linux/amd64 linux/arm64; do
            name=${platform/\//-}
            docker buildx imagetools inspect "$reference" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" \
              | jq -e . > "release/blockops-$VERSION-$name.spdx.json"
            docker buildx imagetools inspect "$reference" \
              --format "{{ json (index .Provenance \"$platform\").SLSA }}" \
              | jq -e . > "release/blockops-$VERSION-$name.provenance.json"
          done

          (
            cd release
            sha256sum ./*.json ./*-image.txt > SHA256SUMS
          )

      - name: Publish the GitHub release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Image:

          ~~~text
          $IMAGE@$DIGEST
          ~~~

          Verify the keyless signature:

          ~~~sh
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$IMAGE@$DIGEST"
          ~~~

          Verify the downloaded evidence on Linux:

          ~~~sh
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "blockops-$VERSION"
          cd "blockops-$VERSION"
          sha256sum --check SHA256SUMS
          test "\$(cat ./*-image.txt)" = "$IMAGE@$DIGEST"
          ~~~

          On macOS, replace the \`sha256sum\` command with \`shasum -a 256 --check SHA256SUMS\`.
          The release contains SPDX and SLSA provenance JSON for both supported platforms.
          The release gate tested Paper 1.21.4 build 232 on Minecraft 1.21.4 on its Linux AMD64 runner.
          It built and attested Linux AMD64 and ARM64 images, but did not run the real-server journeys on ARM64 or Docker Desktop.
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --title "BlockOps $GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --notes-file release-notes.md \
              --title "BlockOps $GITHUB_REF_NAME" \
              --verify-tag
          fi
