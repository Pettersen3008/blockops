name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun run verify
      - run: bun audit --audit-level=high
        working-directory: .

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
        working-directory: frontend
      - name: Assemble production web assets
        run: cp -R frontend/dist/. backend/internal/webui/dist/
      - name: Build production server
        run: go build -trimpath -o "$RUNNER_TEMP/blockops" ./cmd/blockops
        working-directory: backend
      - name: Install Chromium
        run: bun run playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production server
        env:
          BLOCKOPS_LISTEN_ADDRESS: 127.0.0.1:8080
          BLOCKOPS_DATABASE_PATH: ${{ runner.temp }}/blockops-e2e/data/blockops.db
          BLOCKOPS_MINECRAFT_DATA_DIR: ${{ runner.temp }}/blockops-e2e/minecraft
          BLOCKOPS_BACKUP_DIR: ${{ runner.temp }}/blockops-e2e/backups
          BLOCKOPS_DOCKER_URL: http://127.0.0.1:9
          BLOCKOPS_RCON_ADDRESS: 127.0.0.1:9
          BLOCKOPS_RCON_PASSWORD: ci-browser-only
          BLOCKOPS_PUBLIC_ORIGIN: http://127.0.0.1:8080
          BLOCKOPS_COOKIE_SECURE: "false"
        run: |
          mkdir -p "$RUNNER_TEMP/blockops-e2e/data" "$RUNNER_TEMP/blockops-e2e/minecraft" "$RUNNER_TEMP/blockops-e2e/backups"
          "$RUNNER_TEMP/blockops" >"$RUNNER_TEMP/blockops-e2e/server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/blockops-e2e/server.log"
          exit 1
      - name: Run production browser smoke test
        env:
          BLOCKOPS_E2E_URL: http://127.0.0.1:8080
        run: bun run test:e2e
        working-directory: frontend
      - name: Check production security headers
        run: |
          curl --fail --silent --dump-header "$RUNNER_TEMP/blockops-headers" --output /dev/null http://127.0.0.1:8080/
          grep -F "Content-Security-Policy: default-src 'self'" "$RUNNER_TEMP/blockops-headers"
          grep -F "X-Content-Type-Options: nosniff" "$RUNNER_TEMP/blockops-headers"
          grep -F "X-Frame-Options: DENY" "$RUNNER_TEMP/blockops-headers"
          grep -F "Referrer-Policy: no-referrer" "$RUNNER_TEMP/blockops-headers"
          grep -F "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()" "$RUNNER_TEMP/blockops-headers"

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release policy
        run: scripts/release-assert.sh
      - name: Validate Compose for an absolute bind path
        env:
          BLOCKOPS_MINECRAFT_CONTAINER: minecraft
          BLOCKOPS_RCON_PASSWORD: ci-not-a-production-secret
          BLOCKOPS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          MINECRAFT_DATA_SOURCE: /srv/minecraft
        run: |
          docker compose config --quiet
          scripts/compose-assert.sh
      - name: Validate Compose for an existing named volume
        env:
          BLOCKOPS_MINECRAFT_CONTAINER: minecraft
          BLOCKOPS_RCON_PASSWORD: ci-not-a-production-secret
          BLOCKOPS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          MINECRAFT_DATA_SOURCE: minecraft-data
        run: |
          docker compose -f compose.yaml -f compose.minecraft-volume.yaml config --quiet
          scripts/compose-assert.sh -f compose.yaml -f compose.minecraft-volume.yaml
      - run: docker build --tag blockops:ci .
      - name: Confirm non-root runtime user
        run: test "$(docker image inspect blockops:ci --format '{{.Config.User}}')" = "10001:10001"

  integration-fixture:
    runs-on: ubuntu-latest
    needs: [container]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bun run playwright install --with-deps chromium
        working-directory: frontend
      # Starts the production dashboard and guard against a real Paper server and
      # waits on all three health checks. Secrets are generated inside the runner
      # and never printed.
      - name: Start the disposable real-server fixture
        run: scripts/integration.sh up
      # This lane is its own failure domain: a red result here means the real Docker,
      # RCON, or archive integration broke, not the mocked browser journey.
      - name: Run the safe integration journey
        env:
          BLOCKOPS_E2E_INTEGRATION: "true"
          BLOCKOPS_E2E_URL: http://127.0.0.1:8099
        run: bun run test:e2e
        working-directory: frontend
      - name: Remove the fixture and its volumes
        if: always()
        run: scripts/integration.sh down
